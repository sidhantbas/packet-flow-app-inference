<svg xmlns='http://www.w3.org/2000/svg' width='980' height='430' viewBox='0 0 980 430' role='img' aria-label='2. Where the points are lost'>
<style>:root { color-scheme: dark; }</style>
<rect width='980' height='430' fill='#0f172a' rx='14'/>
<text x='28' y='42' fill='#e2e8f0' font-size='22' font-weight='700' font-family='Inter, Helvetica, Arial, sans-serif'>2. Where the points are lost</text>
<text x='28' y='68' fill='#94a3b8' font-size='13' font-weight='400' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>On 81 test flows, one flow in a rare class moves a task's macro F1 by about 0.04 (2 points).</text>
<rect x='28.0' y='92.0' width='450.0' height='200.0' rx='12' fill='#1e293b' stroke='#ef4444' stroke-width='1.5'/>
<text x='50' y='128' fill='#e2e8f0' font-size='18' font-weight='700' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>Task 1 (full flow)</text>
<text x='50' y='168' fill='#94a3b8' font-size='16' font-weight='400' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>Us 0.840</text>
<text x='50' y='196' fill='#94a3b8' font-size='16' font-weight='400' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>Leader 0.964</text>
<text x='50' y='244' fill='#ef4444' font-size='30' font-weight='800' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>−6.2 points</text>
<text x='258' y='244' fill='#e2e8f0' font-size='16' font-weight='400' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>~5 flows of 81</text>
<rect x='498.0' y='92.0' width='450.0' height='200.0' rx='12' fill='#1e293b' stroke='#f59e0b' stroke-width='1.5'/>
<text x='520' y='128' fill='#e2e8f0' font-size='18' font-weight='700' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>Task 2 (first 5 packets)</text>
<text x='520' y='168' fill='#94a3b8' font-size='16' font-weight='400' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>Us 0.905</text>
<text x='520' y='196' fill='#94a3b8' font-size='16' font-weight='400' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>Leader 0.936</text>
<text x='520' y='244' fill='#f59e0b' font-size='30' font-weight='800' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>−1.5 points</text>
<text x='728' y='244' fill='#e2e8f0' font-size='16' font-weight='400' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>~2 flows of 81</text>
<text x='28' y='330' fill='#e2e8f0' font-size='15' font-weight='400' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>Why Task 1: facebook (11 labelled flows) and instagram (19) share Meta's network stack, and macro F1</text>
<text x='28' y='354' fill='#e2e8f0' font-size='15' font-weight='400' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>weights each of them like google (131). Production, 250 CV folds (106): facebook 0.70, instagram 0.77, google 0.91.</text>
<text x='28' y='392' fill='#f59e0b' font-size='15' font-weight='700' text-anchor='start' font-family='Inter, Helvetica, Arial, sans-serif'>Why the gap is hard to close: what our models still miss is confident, not close (093).</text>
</svg>
