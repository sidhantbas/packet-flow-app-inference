<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d">
  <title id="t">Leaderboard score per upload</title>
  <desc id="d">Total score (out of 100) of each Final Test Phase upload, 30 September to 21 October 2026: 83.56, 84.62, 87.77, about 86, 87.77, 88.11, 87.24, 86.36, 88.11, 90.85, about 87. Upload 10 at 90.85 is the best and the displayed entry.</desc>
  <style>
    :root { color-scheme: dark; }
    text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .h  { font-size: 18px; font-weight: 700; fill: #f1f5f9; }
    .s  { font-size: 13px; fill: #94a3b8; }
    .ax { font-size: 12px; fill: #94a3b8; }
    .v  { font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .vb { font-size: 14px; font-weight: 800; fill: #6ee7b7; }
    .grid { stroke: #334155; stroke-width: 1; }
  </style>
  <rect width="960" height="380" rx="14" fill="#0f172a"/>
  <text x="32" y="40" class="h">Score per leaderboard upload (Final Test Phase, out of 100)</text>
  <text x="32" y="62" class="s">Axis starts at 80 · hollow bars: approximate totals · ★ best and displayed entry</text>

  <!-- y axis: 80..92 mapped to y=320..100 (18.33 px per point) -->
  <g class="grid">
    <line x1="70" y1="320" x2="930" y2="320"/>
    <line x1="70" y1="283.3" x2="930" y2="283.3" opacity="0.5"/>
    <line x1="70" y1="246.7" x2="930" y2="246.7" opacity="0.5"/>
    <line x1="70" y1="210" x2="930" y2="210" opacity="0.5"/>
