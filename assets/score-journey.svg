    <rect x="472" y="171.3" width="46" height="148.7" rx="5" fill="#0c4a6e" stroke="#0284c7"/>
    <rect x="548" y="187.3" width="46" height="132.7" rx="5" fill="#0c4a6e" stroke="#0284c7"/>
    <rect x="624" y="203.4" width="46" height="116.6" rx="5" fill="#0c4a6e" stroke="#0284c7"/>
